[mod]
id = "kinetics"
version = "0.1.0"
priority = 100

# Pinned: it needs block entities on any template (hook points API 129) and
# standalone models (API 151), newer than the Nightly of 2026-11-01 (API 80).
# The launcher downloads this commit's source and builds the game on it.
[compatibility]
horizon_revision = "c5c8a33a8a3ec0091060096bdbaab25770778eaf"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "kinetics"
source = "runtime.rs"

[[module]]
id = "wrench-logic"
file = "crates/horizon-client/src/game.rs"
name = "kinetics_wrench"
source = "wrench_logic.rs"

# Shafts and cogwheels get a block entity holding their speed.
[[injection]]
id = "block-entity"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, Compound)>", value = "&mut *entity" },
]

# A kinetic block placed, broken or turned: solve its network again.
[[injection]]
id = "block-changed"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_block_changed"
helper = "block_changed.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "&*self" },
  { name = "dimension", ty = "LevelDimension", value = "dimension" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "old", ty = "BlockStateId", value = "old" },
  { name = "new", ty = "BlockStateId", value = "new" },
]

# At the end of each level's tick, the marked networks get their speeds.
[[injection]]
id = "settle"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_post"
helper = "settle.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

# Clients get the speed.
[[injection]]
id = "update-tag"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_update_tag"
helper = "update_tag.rs"
bindings = [
  { name = "entity", ty = "&ModBlockEntity", value = "entity" },
  { name = "tag", ty = "&mut Option<Compound>", value = "&mut *tag" },
]

# The turning parts' models, baked beside the block models.
[[injection]]
id = "models"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_standalone_models"
helper = "models.rs"
bindings = [
  { name = "models", ty = "&mut Vec<String>", value = "&mut *models" },
]

# The wrench: a click on a kinetic block turns it or, sneaking, picks it up.
[[injection]]
id = "wrench"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_use_item_on"
helper = "wrench.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# Each frame: the part, turned by its speed.
[[injection]]
id = "submit"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_submit"
helper = "submit.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "entity", ty = "&ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut BlockEntityDraw", value = "&mut *draw" },
]

# The clutch and the gearshift: their redstone and drawing rules are a module of their own.
[[module]]
id = "clutch"
file = "crates/horizon-client/src/game.rs"
name = "kinetics_clutch"
source = "clutch.rs"

# A neighbour of a clutch or gearshift changed (a lever, a wire): its signal is read at the end of the tick.
[[injection]]
id = "clutch-neighbor"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_neighbor_changed"
helper = "clutch_neighbor.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "&*self" },
  { name = "dimension", ty = "LevelDimension", value = "dimension" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
]

# The gearbox: where it stands when placed and its vertical item (a block of its own), as a module of the bundle.
[[module]]
id = "gearbox"
file = "crates/horizon-client/src/game.rs"
name = "kinetics_gearbox"
source = "gearbox.rs"

# A gearbox is placed on y, a vertical gearbox across the way the player faces.
[[injection]]
id = "gearbox-placement"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_state_for_placement"
helper = "gearbox_placement.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "&*self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "context", ty = "&PlacementContext", value = "context" },
  { name = "answer", ty = "&mut Option<Option<BlockStateId>>", value = "&mut *answer" },
]

# A vertical gearbox placed: it is made a gearbox at the end of the tick.
[[injection]]
id = "gearbox-changed"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_block_changed"
helper = "gearbox_changed.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "&*self" },
  { name = "dimension", ty = "LevelDimension", value = "dimension" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "new", ty = "BlockStateId", value = "new" },
]

[[injection]]
id = "gearbox-settle"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_post"
helper = "gearbox_settle.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

# The half shafts inside a gearbox, baked beside the block models and drawn every frame.
[[injection]]
id = "gearbox-models"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_standalone_models"
helper = "gearbox_models.rs"
bindings = [
  { name = "models", ty = "&mut Vec<String>", value = "&mut *models" },
]

[[injection]]
id = "gearbox-submit"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_submit"
helper = "gearbox_submit.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "entity", ty = "&ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut BlockEntityDraw", value = "&mut *draw" },
]

# The hand crank. A new block `kinetics:hand_crank` with a `facing`: the rules are in crank.rs (module
# `kinetics_crank`), the injections below are its hooks; the solver reads its speed in settle.rs.
[[module]]
id = "crank"
file = "crates/horizon-client/src/game.rs"
name = "kinetics_crank"
source = "crank.rs"

# The right button on it turns it (held: the click repeats), sneaking turns it the other way.
[[injection]]
id = "crank-click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_right_click_block"
helper = "crank_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# Each tick of a level: turns that ran out stop, turned cranks click.
[[injection]]
id = "crank-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_post"
helper = "crank_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

# The crank's turning part, baked beside the block models.
[[injection]]
id = "crank-models"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_standalone_models"
helper = "crank_models.rs"
bindings = [
  { name = "models", ty = "&mut Vec<String>", value = "&mut *models" },
]

# Each frame: the crank's shaft and handle.
[[injection]]
id = "crank-submit"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_submit"
helper = "crank_submit.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "entity", ty = "&ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut BlockEntityDraw", value = "&mut *draw" },
]

# The creative motor. A new block `kinetics:creative_motor` with a `facing`: the rules are in motor.rs (module
# `kinetics_motor`), the injections below are its hooks. Players' changes of its speed are queued and applied at the end
# of the level's tick (motor_apply.rs), and the solver reads the setting from the block entity (settle.rs).
[[module]]
id = "motor"
file = "crates/horizon-client/src/game.rs"
name = "kinetics_motor"
source = "motor.rs"

# Placed facing a shaft beside it, else the player.
[[injection]]
id = "motor-place"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_state_for_placement"
helper = "motor_place.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "&*self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "context", ty = "&PlacementContext", value = "context" },
  { name = "answer", ty = "&mut Option<Option<BlockStateId>>", value = "&mut *answer" },
]

# The right button with empty hands reverses it.
[[injection]]
id = "motor-click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_right_click_block"
helper = "motor_click.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# The wheel over it: the window sends the change to the server.
[[injection]]
id = "motor-scroll"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mouse_scrolling"
helper = "motor_scroll.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "accumulated", ty = "[i32; 2]", value = "accumulated" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# The server hears the wheel and queues the change.
[[injection]]
id = "motor-net"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_net_from_client"
helper = "motor_net.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

# The queued changes become the motors' settings.
[[injection]]
id = "motor-apply"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_post"
helper = "motor_apply.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

# The value box under the crosshair.
[[injection]]
id = "motor-hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_gui_layer_post"
helper = "motor_hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "layer", ty = "&str", value = "layer" },
  { name = "batch", ty = "&mut HudBatch", value = "&mut *batch" },
]

# The motor's models, baked beside the block models.
[[injection]]
id = "motor-models"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_standalone_models"
helper = "motor_models.rs"
bindings = [
  { name = "models", ty = "&mut Vec<String>", value = "&mut *models" },
]

# Each frame: the motor's body and its turning shaft.
[[injection]]
id = "motor-submit"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_submit"
helper = "motor_submit.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "entity", ty = "&ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut BlockEntityDraw", value = "&mut *draw" },
]

# The casing: its rules (cased variants, model names) are a module of their own.
[[module]]
id = "casing"
file = "crates/horizon-client/src/game.rs"
name = "kinetics_casing"
source = "casing.rs"

# A casing used on a shaft or cogwheel: it becomes the cased block.
[[injection]]
id = "casing-use"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_use_item_on"
helper = "casing_use.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# Each frame: the casing's look, and what turns inside a cased part.
[[injection]]
id = "casing-submit"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_submit"
helper = "casing_submit.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "entity", ty = "&ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut BlockEntityDraw", value = "&mut *draw" },
]

# The rotation speed controller. A new block `kinetics:rotation_speed_controller` with a horizontal `axis`: its rules
# are in speed_controller.rs (module `kinetics_speed_controller`) and the link to the large cogwheel above it in
# runtime.rs. Its target is set like the creative motor's (the motor-* hooks above also take this block) and saved
# under the same `rpm` key; its shaft is drawn by the generic `submit.rs`.
[[module]]
id = "speed-controller"
file = "crates/horizon-client/src/game.rs"
name = "kinetics_speed_controller"
source = "speed_controller.rs"

# Placed across the large cogwheel above it, else across the player's view.
[[injection]]
id = "speed-controller-place"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_state_for_placement"
helper = "speed_controller_place.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "&*self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "context", ty = "&PlacementContext", value = "context" },
  { name = "answer", ty = "&mut Option<Option<BlockStateId>>", value = "&mut *answer" },
]


# The encased chain drive and the adjustable chain gearshift: how they chain to each other and follow redstone is a
# module of its own (chain.rs).
[[module]]
id = "chain"
file = "crates/horizon-client/src/game.rs"
name = "kinetics_chain"
source = "chain.rs"

# A chain drive placed or broken: it is chained to its neighbours at the end of the tick.
[[injection]]
id = "chain-changed"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_block_changed"
helper = "chain_changed.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "&*self" },
  { name = "dimension", ty = "LevelDimension", value = "dimension" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "old", ty = "BlockStateId", value = "old" },
  { name = "new", ty = "BlockStateId", value = "new" },
]

# A neighbour of a chain drive or gearshift changed: its chain and its redstone are read at the end of the tick.
[[injection]]
id = "chain-neighbor"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_neighbor_changed"
helper = "chain_neighbor.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "&*self" },
  { name = "dimension", ty = "LevelDimension", value = "dimension" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
]

[[injection]]
id = "chain-settle"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_post"
helper = "chain_settle.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

# Each frame: the chain drive's look and its turning shaft.
[[injection]]
id = "chain-submit"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_submit"
helper = "chain_submit.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "entity", ty = "&ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut BlockEntityDraw", value = "&mut *draw" },
]
