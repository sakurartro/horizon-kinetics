[mod]
id = "kinetics"
version = "0.1.0"
priority = 100

# Pinned: it needs block entities on any template (hook points API 129) and
# standalone models (API 151), newer than the Nightly of 2026-11-01 (API 80).
# The launcher downloads this commit's source and builds the game on it.
[compatibility]
horizon_revision = "c5c8a33a8a3ec0091060096bdbaab25770778eaf"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "kinetics"
source = "runtime.rs"

# Shafts and cogwheels get a block entity holding their speed.
[[injection]]
id = "block-entity"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, Compound)>", value = "&mut *entity" },
]

# A kinetic block placed, broken or turned: solve its network again.
[[injection]]
id = "block-changed"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_block_changed"
helper = "block_changed.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "&*self" },
  { name = "dimension", ty = "LevelDimension", value = "dimension" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "old", ty = "BlockStateId", value = "old" },
  { name = "new", ty = "BlockStateId", value = "new" },
]

# At the end of each level's tick, the marked networks get their speeds.
[[injection]]
id = "settle"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_post"
helper = "settle.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

# Clients get the speed.
[[injection]]
id = "update-tag"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_update_tag"
helper = "update_tag.rs"
bindings = [
  { name = "entity", ty = "&ModBlockEntity", value = "entity" },
  { name = "tag", ty = "&mut Option<Compound>", value = "&mut *tag" },
]

# The turning parts' models, baked beside the block models.
[[injection]]
id = "models"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_standalone_models"
helper = "models.rs"
bindings = [
  { name = "models", ty = "&mut Vec<String>", value = "&mut *models" },
]

# Each frame: the part, turned by its speed.
[[injection]]
id = "submit"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_submit"
helper = "submit.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "entity", ty = "&ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut BlockEntityDraw", value = "&mut *draw" },
]

# The gearbox: where it stands when placed and its vertical item (a block of its own), as a module of the bundle.
[[module]]
id = "gearbox"
file = "crates/horizon-client/src/game.rs"
name = "kinetics_gearbox"
source = "gearbox.rs"

# A gearbox is placed on y, a vertical gearbox across the way the player faces.
[[injection]]
id = "gearbox-placement"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_state_for_placement"
helper = "gearbox_placement.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "&*self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "context", ty = "&PlacementContext", value = "context" },
  { name = "answer", ty = "&mut Option<Option<BlockStateId>>", value = "&mut *answer" },
]

# A vertical gearbox placed: it is made a gearbox at the end of the tick.
[[injection]]
id = "gearbox-changed"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_block_changed"
helper = "gearbox_changed.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "&*self" },
  { name = "dimension", ty = "LevelDimension", value = "dimension" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "new", ty = "BlockStateId", value = "new" },
]

[[injection]]
id = "gearbox-settle"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_post"
helper = "gearbox_settle.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

# The half shafts inside a gearbox, baked beside the block models and drawn every frame.
[[injection]]
id = "gearbox-models"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_standalone_models"
helper = "gearbox_models.rs"
bindings = [
  { name = "models", ty = "&mut Vec<String>", value = "&mut *models" },
]

[[injection]]
id = "gearbox-submit"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_submit"
helper = "gearbox_submit.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "entity", ty = "&ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut BlockEntityDraw", value = "&mut *draw" },
]
