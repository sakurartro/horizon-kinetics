[package]
name = "horizon-mod-kinetics"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Shafts and cogwheels for Horizon: the rotation network logic and its tests."

# The same file the bundle adds to the game as `game::kinetics`.
[lib]
path = "mixins/kinetics/runtime.rs"

# casing.rs is a module of the bundle like runtime.rs, with its tests in a target of their own.
[[test]]
name = "casing"
path = "mixins/kinetics/casing.rs"
# The wrench's choices: also the module the bundle adds to the game as `game::kinetics_wrench`.
[[test]]
name = "wrench"
path = "mixins/kinetics/wrench_logic.rs"
